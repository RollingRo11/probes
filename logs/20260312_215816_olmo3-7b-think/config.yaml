# Probes trained on eval-awareness-only subset of Test Awareness Steering.
#
# Positive: model's CoT shows EVAL AWARENESS (awareness=Yes/Maybe)
# Negative: everything else (awareness=No), including recognition-only
#
# 1484 examples (742 pos, 742 neg), balanced.

model:
    id: "allenai/Olmo-3-7B-Think"
    short_name: "olmo3-7b-think"
    num_layers: 32
    hidden_size: 4096
    layer_path: "model.layers"
    layer_output_index: null

probes:
    types:
        - linear
        - mlp
    layers: "all"

    mlp_hidden_dim: 100
    mlp_n_layers: 2
    n_heads: 10
    rolling_window: 10
    ema_alpha: 0.5

dataset:
    path: "data/test_awareness.jsonl"
    text_col: "text"
    label_col: "label"
    train_frac: 0.8
    val_frac: 0.1
    test_frac: 0.1
    seed: 42

extraction:
    batch_size: 4
    token_strategy: "evidence_spans"
    max_length: 2048

training:
    loss: "bce"
    optimizer: "adamw"
    lr: 1.0e-4
    weight_decay: 3.0e-3
    betas: [0.9, 0.999]
    epochs: 1000
    full_batch: true
    n_seeds: 100

evaluation:
    threshold: "youden"
    fnr_weight: 5.0
    hard_neg_fpr_weight: 2.0
    overtrigger_fpr_weight: 50.0

vllm:
    tensor_parallel_size: 1

slurm:
    partition: "compute"
    max_concurrent: 16
    extract_timeout: "6:00:00"
    train_timeout: "4:00:00"
    job_name: "probes-evalaware"
    gpus_per_node: 8
    cpus_per_node: 64
    extract_gpus: 1
    train_gpus: 1

wandb:
    enabled: true
    project: "probes"
    entity: null

paths:
    data: "data/"
    activations: "activations/"
    results: "results/"
