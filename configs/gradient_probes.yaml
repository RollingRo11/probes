# Gradient-based probes: linear + EMA on OLMo-3-7B-Think.
# Uses AdamW + full-batch BCE as in arXiv:2601.11516.

model:
  id: "allenai/Olmo-3-7B-Think"
  short_name: "olmo3-7b-think"
  num_layers: 32
  hidden_size: 4096
  layer_path: "model.model.layers"
  layer_output_index: 0

probes:
  types:
    - linear
    - ema
  # EMA probe trains identically to linear (mean pooling), then uses EMA-max
  # aggregation at inference time. Requires token_strategy "all" or "last" for
  # training, but needs "all" for proper EMA inference evaluation.
  layers: "all"

dataset:
  path: "data/eval_awareness.jsonl"
  text_col: "text"
  label_col: "label"
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1
  seed: 42

extraction:
  batch_size: 8
  # EMA probe needs per-position activations at inference.
  token_strategy: "all"
  max_length: 2048

training:
  loss: "bce"
  optimizer: "adamw"
  lr: 1.0e-4
  weight_decay: 3.0e-3
  betas: [0.9, 0.999]
  epochs: 1000
  full_batch: true
  n_seeds: 10

evaluation:
  threshold: "youden"
  fnr_weight: 5.0
  hard_neg_fpr_weight: 2.0
  overtrigger_fpr_weight: 50.0

vllm:
  tensor_parallel_size: 1

slurm:
  partition: "compute"
  max_concurrent: 8
  extract_timeout: "6:00:00"
  train_timeout: "2:00:00"
  job_name: "probes-grad"
  gpus_per_node: 8
  cpus_per_node: 64
  extract_gpus: 1
  train_gpus: 1

wandb:
  enabled: false       # set to true to enable
  project: "probes"
  entity: null         # defaults to wandb default entity

paths:
  data: "data/"
  activations: "activations/"
  results: "results/"
