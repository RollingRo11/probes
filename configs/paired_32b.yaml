# Paired contrastive training on OLMo-3.1-32B-Think (arXiv:2603.19426)
#
# Same format-deconfounded 2x2 dataset as paired.yaml but on the larger
# 32B model. Evaluation awareness scales with model size (arXiv:2509.13333),
# so we expect stronger signal here.

model:
  id: "allenai/OLMo-3.1-32B-Think"
  short_name: "olmo31-32b-think"
  num_layers: 64
  hidden_size: 5120
  layer_path: "model.layers"
  layer_output_index: null

probes:
  types:
    - mean_diff
    - linear
    - mlp
  layers: "all"
  mlp_hidden_dim: 100
  mlp_n_layers: 2

dataset:
  path: "data/paired_contrastive.jsonl"
  text_col: "text"
  label_col: "label"
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1
  seed: 42

extraction:
  batch_size: 4
  token_strategy: "last"
  max_length: 2048

training:
  loss: "bce"
  optimizer: "adamw"
  lr: 1.0e-4
  weight_decay: 3.0e-3
  betas: [0.9, 0.999]
  epochs: 1000
  full_batch: true
  n_seeds: 10

evaluation:
  threshold: "youden"
  fnr_weight: 5.0
  hard_neg_fpr_weight: 2.0
  overtrigger_fpr_weight: 50.0

slurm:
  partition: "compute"
  max_concurrent: 16
  extract_timeout: "12:00:00"
  train_timeout: "2:00:00"
  job_name: "probes-paired-32b"
  gpus_per_node: 8
  cpus_per_node: 64
  extract_gpus: 2
  train_gpus: 1

wandb:
  enabled: true
  project: "probes"

paths:
  data: "data/"
  activations: "activations/"
  results: "results/"
