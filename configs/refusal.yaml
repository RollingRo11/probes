# Refusal probe: predicts whether the model's output is a refusal.
# Trained on prompt activations (not completions), so the probe detects
# the model's internal "about to refuse" state before generation.
#
# Reference: "LLMs Encode Harmfulness and Refusal Separately"
#   Zhao et al. (NeurIPS 2025) — markxiv.org/abs/2507.11878
# The paper finds refusal direction localizes at post-instruction tokens,
# distinct from harmfulness direction at last instruction token.

model:
  id: "allenai/Olmo-3-7B-Think"
  short_name: "olmo3-7b-think"
  num_layers: 32
  hidden_size: 4096
  layer_path: "model.layers"
  layer_output_index: null

probes:
  types:
    - mean_diff
    - linear
  layers: "all"

dataset:
  path: "data/refusal.jsonl"
  text_col: "text"
  label_col: "label"   # 0 = model complied, 1 = model refused
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1
  seed: 42

extraction:
  batch_size: 8
  token_strategy: "last"
  max_length: 2048

training:
  loss: "bce"
  optimizer: "adamw"
  lr: 1.0e-4
  weight_decay: 3.0e-3
  betas: [0.9, 0.999]
  epochs: 1000
  full_batch: true
  n_seeds: 1

evaluation:
  threshold: "youden"
  fnr_weight: 5.0
  hard_neg_fpr_weight: 2.0
  overtrigger_fpr_weight: 50.0

slurm:
  partition: "compute"
  max_concurrent: 8
  extract_timeout: "4:00:00"
  train_timeout: "1:00:00"
  job_name: "refuse-probes"
  gpus_per_node: 8
  cpus_per_node: 64
  extract_gpus: 1
  train_gpus: 1

wandb:
  enabled: true
  project: "probes"
  entity: null
