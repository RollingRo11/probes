# All probe types from arXiv:2601.11516 "Building Production-Ready Probes for Gemini"
# on OLMo-3-7B-Think. Uses production-grade evaluation with weighted error metric
# and 100 random seeds to guard against selection bias.
#
# Probe types:
#   mean_diff       - closed-form difference-of-means (fast baseline)
#   linear          - gradient BCE, identity transform + mean pool
#   ema             - linear weights + EMA-max inference aggregation (alpha=0.5)
#   mlp             - 2-layer ReLU MLP (width=100) + mean pool
#   attention       - MLP transform + multi-head soft attention aggregation
#   multimax        - MLP transform + per-head hard max (main contribution of 2601.11516)
#   max_rolling_mean- MLP transform + sliding-window attention + max (window=10)

model:
  id: "allenai/Olmo-3-7B-Think"
  short_name: "olmo3-7b-think"
  num_layers: 32
  hidden_size: 4096
  layer_path: "model.model.layers"
  layer_output_index: 0

probes:
  types:
    - mean_diff
    - linear
    - ema
    - mlp
    - attention
    - multimax
    - max_rolling_mean
  # Paper uses middle layer as primary; "all" trains across all layers for comparison.
  layers: "all"

  # Hyperparameters for MLP-based probes (mlp, attention, multimax, max_rolling_mean)
  mlp_hidden_dim: 100
  mlp_n_layers: 2

  # Attention / multimax / max_rolling_mean heads
  n_heads: 10

  # Rolling mean window width
  rolling_window: 10

  # EMA alpha
  ema_alpha: 0.5

dataset:
  path: "data/eval_awareness.jsonl"
  text_col: "text"
  label_col: "label"
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1
  seed: 42

extraction:
  batch_size: 4
  # Must be "all" since attention/multimax/rolling_mean need per-position activations.
  token_strategy: "all"
  max_length: 2048

training:
  loss: "bce"
  optimizer: "adamw"
  lr: 1.0e-4
  weight_decay: 3.0e-3
  betas: [0.9, 0.999]
  epochs: 1000
  full_batch: true
  # 100 seeds: select best on val weighted error, report test metrics.
  n_seeds: 100

evaluation:
  threshold: "youden"
  # Weighted error from arXiv:2601.11516 Section 3.2:
  #   E_w = w_fnr * FNR + w_hard * hard_neg_FPR + w_over * overtrigger_FPR
  fnr_weight: 5.0
  hard_neg_fpr_weight: 2.0
  overtrigger_fpr_weight: 50.0

vllm:
  tensor_parallel_size: 1

slurm:
  partition: "compute"
  max_concurrent: 16
  extract_timeout: "6:00:00"
  train_timeout: "4:00:00"
  job_name: "probes-all"
  gpus_per_node: 8
  cpus_per_node: 64
  extract_gpus: 1
  train_gpus: 1

paths:
  data: "data/"
  activations: "activations/"
  results: "results/"
