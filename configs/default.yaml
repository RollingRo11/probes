# Default config: difference-of-means linear probe for evaluation awareness
# Matches the setup of arXiv:2507.01786 (eval awareness in Llama-3.3-70B-Instruct)
# but applied to OLMo-3-7B-Think.
#
# Reference: "Evaluating Evaluation Awareness" arXiv:2507.01786
# - Extract activations from all 32 layers
# - Train closed-form mean-diff probe per layer (threshold via Youden's J)
# - Primary metric: AUROC

model:
  id: "allenai/Olmo-3-7B-Think"
  short_name: "olmo3-7b-think"
  num_layers: 32
  hidden_size: 4096
  # Attribute path to transformer layers inside NNsight LanguageModel proxy.
  # For OLMo/Llama: model.model.layers (model → OlmoForCausalLM.model → OlmoModel.layers)
  layer_path: "model.model.layers"
  # Which element of the layer's output tuple is the hidden state.
  # 0 for most Llama/OLMo decoder layers.
  layer_output_index: 0

probes:
  # Probe types to train. For a quick closed-form run, use mean_diff.
  # Available: mean_diff, linear, ema, mlp, attention, multimax, max_rolling_mean
  types:
    - mean_diff
  # Which layers to probe. "all" trains one probe per layer.
  # Can also be "mid" (layer n//2) or a list like [10, 16, 20, 28].
  layers: "all"

dataset:
  path: "data/eval_awareness.jsonl"
  text_col: "text"
  label_col: "label"   # 0 = deployment context, 1 = evaluation/test context
  # Fractions must sum to 1.0
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1
  seed: 42

extraction:
  batch_size: 8
  # "last" = last non-padding token (best for causal LMs probing single representation)
  # "mean" = mean over non-padding positions
  # "all"  = all token positions (required for ema/attention/multimax/max_rolling_mean)
  token_strategy: "last"
  max_length: 2048

training:
  # mean_diff uses closed-form fitting; fields below apply to gradient-based probes only.
  loss: "bce"
  optimizer: "adamw"
  lr: 1.0e-4
  weight_decay: 3.0e-3
  betas: [0.9, 0.999]
  epochs: 1000
  full_batch: true  # full-batch gradient descent as in arXiv:2601.11516
  # Number of random initialization seeds per probe.
  # arXiv:2601.11516 uses 100 to estimate variance and guard against overfitting.
  n_seeds: 1

evaluation:
  # Threshold selection: "youden" (maximize J = sensitivity + specificity - 1)
  threshold: "youden"
  # Weighted error weights from arXiv:2601.11516 (used only when computing
  # production-ready weighted error metric; standard config reports AUROC).
  fnr_weight: 5.0
  hard_neg_fpr_weight: 2.0
  overtrigger_fpr_weight: 50.0

vllm:
  tensor_parallel_size: 1

slurm:
  partition: "compute"
  # Max concurrent SLURM train jobs (extract always runs alone first).
  max_concurrent: 8
  # Timeout for the extraction job (model load + full dataset pass).
  extract_timeout: "4:00:00"
  # Timeout per individual probe training job.
  train_timeout: "1:00:00"
  job_name: "probes"
  gpus_per_node: 8
  cpus_per_node: 64
  # GPUs allocated for the extraction job.
  extract_gpus: 1
  # GPUs allocated per probe training job.
  train_gpus: 1

paths:
  data: "data/"
  activations: "activations/"
  results: "results/"
