# Probes trained on Test Awareness Steering dataset (arXiv:2505.14617)
# using OLMo-3.1-32B-Think.
#
# Same dataset and extraction strategy as test_awareness.yaml but for 32B model.
# Extraction mean-pools over evidence span tokens.
# 4134 examples (2067 pos, 2067 neg), balanced.

model:
    id: "allenai/Olmo-3.1-32B-Think"
    short_name: "olmo31-32b-think"
    num_layers: 64
    hidden_size: 5120
    layer_path: "model.layers"
    layer_output_index: null

probes:
    types:
        - linear
        - ema
        - mlp
        - attention
        - multimax
        - max_rolling_mean
    layers: "all"

    mlp_hidden_dim: 100
    mlp_n_layers: 2
    n_heads: 10
    rolling_window: 10
    ema_alpha: 0.5

dataset:
    path: "data/test_awareness.jsonl"
    text_col: "text"
    label_col: "label"
    train_frac: 0.8
    val_frac: 0.1
    test_frac: 0.1
    seed: 42

extraction:
    batch_size: 2
    token_strategy: "evidence_spans"
    max_length: 2048

training:
    loss: "bce"
    optimizer: "adamw"
    lr: 1.0e-4
    weight_decay: 3.0e-3
    betas: [0.9, 0.999]
    epochs: 1000
    full_batch: true
    n_seeds: 100

evaluation:
    threshold: "youden"
    fnr_weight: 5.0
    hard_neg_fpr_weight: 2.0
    overtrigger_fpr_weight: 50.0

vllm:
    tensor_parallel_size: 1

slurm:
    partition: "compute"
    max_concurrent: 16
    extract_timeout: "12:00:00"
    train_timeout: "4:00:00"
    job_name: "probes-testaware-32b"
    gpus_per_node: 8
    cpus_per_node: 64
    extract_gpus: 4
    train_gpus: 1

wandb:
    enabled: true
    project: "probes"
    entity: null

paths:
    data: "data/"
    activations: "activations/"
    results: "results/"
